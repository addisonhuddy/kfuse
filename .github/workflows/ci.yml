name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: make build
      - run: make test
      - run: make test-race

  # Real FUSE mount lifecycle checks. Unlike the unit job, a missing /dev/fuse
  # or fusermount3 here is a failure: the point of this job is that the mount
  # tests actually ran.
  fuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: test -e /dev/fuse && command -v fusermount3
      - run: make test-fuse

  # Keeps the release Dockerfile and GoReleaser config green without
  # publishing anything.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t kfuse:ci .
      - name: kfuse version
        run: |
          out=$(docker run --rm kfuse:ci version)
          echo "$out"
          test "$out" = "ci-${GITHUB_SHA::7}"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker
      - run: ls -l dist/*.tar.gz dist/checksums.txt

  # Integration tests talk to a real Confluent cluster and S3 bucket, so they
  # only run when the repository secrets are configured (manual dispatch or
  # pushes to main — never for forked pull requests).
  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Write .env from secrets
        id: env
        env:
          KF_KAFKA_BROKERS: ${{ secrets.KF_KAFKA_BROKERS }}
          KF_KAFKA_SASL_USERNAME: ${{ secrets.KF_KAFKA_SASL_USERNAME }}
          KF_KAFKA_SASL_PASSWORD: ${{ secrets.KF_KAFKA_SASL_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          KF_BLOB_BUCKET: ${{ secrets.KF_BLOB_BUCKET }}
        run: |
          if [ -z "$KF_KAFKA_BROKERS" ] || [ -z "$KF_BLOB_BUCKET" ]; then
            echo "integration secrets not configured; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "KF_KAFKA_BROKERS=$KF_KAFKA_BROKERS"
            echo "KF_KAFKA_SASL_USERNAME=$KF_KAFKA_SASL_USERNAME"
            echo "KF_KAFKA_SASL_PASSWORD=$KF_KAFKA_SASL_PASSWORD"
            echo "KF_KAFKA_TLS=true"
            echo "KF_KAFKA_TOPIC=kfuse.events"
            echo "AWS_REGION=$AWS_REGION"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "KF_BLOB_BUCKET=$KF_BLOB_BUCKET"
          } > .env
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.env.outputs.ready == 'true'
        run: make integration-test
