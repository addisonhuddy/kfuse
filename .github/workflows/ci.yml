name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make test-install
      - run: make test-preflight
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - run: make build
      - run: make test
      - run: make test-race

  # Real FUSE mount lifecycle checks. Unlike the unit job, a missing /dev/fuse
  # or fusermount3 here is a failure: the point of this job is that the mount
  # tests actually ran.
  fuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: test -e /dev/fuse && command -v fusermount3
      - run: make test-fuse

  # Keeps the release Dockerfile and GoReleaser config green without
  # publishing anything.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t kfuse:ci .
      - name: kfuse version
        run: |
          out=$(docker run --rm kfuse:ci version)
          echo "$out"
          test "$out" = "ci-${GITHUB_SHA::7}"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker
      - run: ls -l dist/*.tar.gz dist/checksums.txt

  # Provider-neutral integration coverage: the same tests run against local
  # Apache Kafka (single-node KRaft) and MinIO on every PR, without secrets.
  local-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./examples/local/up.sh
      - run: make test-local-network
      - run: cp examples/local/local.env .env
      - run: make integration-test
      - if: always()
        run: ./examples/local/down.sh

  # Hosted integration tests talk to the preferred Confluent + AWS setup, so
  # they only run when the repository secrets are configured (manual dispatch
  # or pushes to main — never for forked pull requests).
  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Write .env from secrets
        id: env
        env:
          BOOTSTRAP_SERVER: ${{ secrets.BOOTSTRAP_SERVER }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          skip() {
            echo "::warning::$1; skipping hosted integration tests"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Same placeholder shapes as kfuse_require_env in
          # examples/local/env.sh; values are never printed.
          placeholder() {
            local v=${1,,}
            [[ "$v" == *your_* || "$v" == *'<'*'>'* ||
               "$v" == *changeme* || "$v" == *example.com* ]]
          }
          for name in BOOTSTRAP_SERVER KAFKA_SASL_USERNAME KAFKA_SASL_PASSWORD \
                      S3_REGION S3_ACCESS_KEY S3_SECRET_KEY S3_BUCKET; do
            v=${!name:-}
            if [ -z "$v" ]; then
              skip "secret $name is not set"
            elif placeholder "$v"; then
              skip "secret $name still has its template placeholder value"
            fi
          done
          # Probe the bootstrap broker: an unreachable cluster (dead, rotated,
          # or placeholder DNS) would otherwise fail every push to main while
          # covering nothing local-integration doesn't already cover.
          hostport=${BOOTSTRAP_SERVER%%,*}
          if ! timeout 8 bash -c "</dev/tcp/${hostport%:*}/${hostport##*:}" 2>/dev/null; then
            skip "Kafka bootstrap server is unreachable from CI"
          fi
          {
            echo "BOOTSTRAP_SERVER=$BOOTSTRAP_SERVER"
            echo "KAFKA_SASL_USERNAME=$KAFKA_SASL_USERNAME"
            echo "KAFKA_SASL_PASSWORD=$KAFKA_SASL_PASSWORD"
            echo "KAFKA_TLS=true"
            echo "KAFKA_TOPIC=kfuse.events"
            echo "S3_REGION=$S3_REGION"
            echo "S3_ACCESS_KEY=$S3_ACCESS_KEY"
            echo "S3_SECRET_KEY=$S3_SECRET_KEY"
            echo "S3_BUCKET=$S3_BUCKET"
          } > .env
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.env.outputs.ready == 'true'
        run: make integration-test
