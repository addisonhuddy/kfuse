name: Vulnerability scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "14 6 * * 1" # Mondays 06:14 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make install-tools
      - run: make vuln
